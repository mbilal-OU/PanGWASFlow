name: Pneumococcal case-study validation

on:
  pull_request:
    paths:
      - '.github/workflows/pneumococcus-case-study.yml'
      - 'case_studies/pneumococcus_penicillin/**'
      - 'src/pangwasflow/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/pneumococcus-case-study.yml'
      - 'case_studies/pneumococcus_penicillin/**'
      - 'src/pangwasflow/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  figshare-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve Figshare record and file manifest
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from pathlib import Path

          article_id = 7588832
          url = f'https://api.figshare.com/v2/articles/{article_id}'
          with urllib.request.urlopen(url, timeout=60) as response:
              record = json.load(response)

          manifest = {
              'article_id': article_id,
              'title': record.get('title'),
              'doi': record.get('doi'),
              'url_public_api': record.get('url_public_api'),
              'license': record.get('license'),
              'files': [
                  {
                      'id': item.get('id'),
                      'name': item.get('name'),
                      'size': item.get('size'),
                      'download_url': item.get('download_url'),
                      'computed_md5': item.get('computed_md5'),
                  }
                  for item in record.get('files', [])
              ],
          }
          Path('/tmp/figshare_manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps(manifest, indent=2))
          assert manifest['files'], 'Figshare record returned no files'
          PY
      - name: Verify expected tutorial record
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('/tmp/figshare_manifest.json').read_text())
          title = str(manifest.get('title') or '').lower()
          assert 'pyseer' in title, manifest
          print(f"Resolved {len(manifest['files'])} downloadable object(s) for {manifest['title']}")
          PY
